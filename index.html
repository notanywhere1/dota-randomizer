<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Roulette Fix</title>
    <style>
        body { background-color: #1a1b20; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; background: #22252c; padding: 30px; border-radius: 12px; max-width: 600px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff4c4c; text-transform: uppercase; }
        .error-log { color: #ff4c4c; font-weight: bold; margin: 10px 0; font-size: 14px; }
        .hero-section { margin: 20px 0; min-height: 140px; }
        .hero-box { width: 200px; height: 110px; margin: 0 auto 10px; display: none; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border-radius: 6px; text-shadow: 0 2px 4px #000; }
        .hero-name { font-size: 24px; font-weight: bold; }
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .item-slot { background: #15161a; padding: 10px; border: 2px solid #3a3d45; border-radius: 6px; min-height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .item-box { width: 80px; height: 55px; margin-bottom: 5px; display: none; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border-radius: 4px; color: #fff; text-align: center; }
        .item-title { font-size: 13px; color: #b0b0c2; text-align: center; }
        button { background: #ff4c4c; color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #ff3333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dota 2 Roulette</h1>
    <div class="error-log" id="debug-error"></div>
    
    <div class="hero-section">
        <div id="hero-block" class="hero-box"></div>
        <div class="hero-name" id="hero-display">Нажми на кнопку!</div>
    </div>
    
    <div class="items-grid">
        <div class="item-slot" id="slot-1"><div class="item-title">Слот 1</div></div>
        <div class="item-slot" id="slot-2"><div class="item-title">Слот 2</div></div>
        <div class="item-slot" id="slot-3"><div class="item-title">Слот 3</div></div>
        <div class="item-slot" id="slot-4"><div class="item-title">Слот 4</div></div>
        <div class="item-slot" id="slot-5"><div class="item-title">Слот 5</div></div>
        <div class="item-slot" id="slot-6"><div class="item-title">Слот 6</div></div>
    </div>
    
    <button onclick="generateChallenge()">Крутить рулетку!</button>
</div>

<script>
    // Защищенная встроенная база данных
    const heroes = [
        { name: "Pudge", type: "#5c1d1d" }, { name: "Invoker", type: "#431d5c" }, { name: "Anti-Mage", type: "#1d5c2b" },
        { name: "Shadow Fiend", type: "#1d5c2b" }, { name: "Juggernaut", type: "#1d5c2b" }, { name: "Axe", type: "#5c1d1d" },
        { name: "Crystal Maiden", type: "#1d3d5c" }, { name: "Slark", type: "#1d5c2b" }, { name: "Sniper", type: "#1d5c2b" },
        { name: "Zeus", type: "#1d3d5c" }, { name: "Sven", type: "#5c1d1d" }, { name: "Wraith King", type: "#5c1d1d" }
    ];

    const items = [
        { name: "Blink Dagger", color: "#2ca887" }, { name: "Black King Bar", color: "#40454f" },
        { name: "Daedalus", color: "#a82c2c" }, { name: "Desolator", color: "#a82c2c" },
        { name: "Divine Rapier", color: "#bfa11f" }, { name: "Heart of Tarrasque", color: "#40454f" },
        { name: "Manta Style", color: "#40454f" }, { name: "Aghanim's Scepter", color: "#2c72a8" },
        { name: "Satanic", color: "#40454f" }, { name: "Shiva's Guard", color: "#2c72a8" },
        { name: "Power Treads", color: "#5c4632" }, { name: "Phase Boots", color: "#5c4632" }
    ];

    window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('debug-error').innerText = "Ошибка в коде: " + message + " (Строка: " + lineno + ")";
        return false;
    };

    function generateChallenge() {
        try {
            document.getElementById('debug-error').innerText = ""; // Очищаем старые ошибки
            
            // 1. Выбор героя
            const randomHero = heroes[Math.floor(Math.random() * heroes.length)];
            const heroBlock = document.getElementById('hero-block');
            heroBlock.style.backgroundColor = randomHero.type;
            heroBlock.style.display = 'flex';
            heroBlock.innerText = randomHero.name.toUpperCase();
            document.getElementById('hero-display').innerText = randomHero.name;

            // 2. Перемешивание предметов
            let shuffledItems = [...items].sort(() => 0.5 - Math.random());

            // 3. Заполнение 6 слотов
            for (let i = 1; i <= 6; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const itemData = shuffledItems[i - 1];
                
                slot.innerHTML = `
                    <div class="item-box" style="display:flex; background-color:${itemData.color};">DOTA 2</div>
                    <div class="item-title">${itemData.name}</div>
                `;
            }
        } catch (err) {
            document.getElementById('debug-error').innerText = "Ошибка при генерации: " + err.message;
        }
    }
</script>

</body>
</html>
