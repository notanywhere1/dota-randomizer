<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Ultimate Roulette</title>
    <style>
        body {
            background-color: #1a1b20;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #22252c;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4c4c; text-transform: uppercase; margin-bottom: 5px; }
        .loading-status { color: #888; font-size: 14px; margin-bottom: 20px; }
        .hero-section { margin: 20px 0; min-height: 160px; }
        .hero-img { width: 200px; height: 114px; border-radius: 6px; display: none; margin: 0 auto 10px; border: 2px solid #444; object-fit: cover; }
        .hero-name { font-size: 24px; font-weight: bold; }
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .item-slot { background: #15161a; padding: 10px; border: 2px solid #3a3d45; border-radius: 6px; min-height: 90px; display: flex; flex-direction: column; justify-content: center; }
        .item-img { width: 85px; height: 60px; border-radius: 4px; display: none; margin: 0 auto 5px; object-fit: cover; }
        .item-title { font-size: 13px; color: #b0b0c2; }
        button {
            background: #ff4c4c; color: white; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        button:hover { background: #ff3333; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dota 2 Roulette</h1>
    <div class="loading-status" id="status">Загрузка базы данных Valve...</div>
    
    <div class="hero-section">
        <img id="hero-image" class="hero-img" src="" alt="Hero">
        <div class="hero-name" id="hero-display">Нажми на кнопку!</div>
    </div>
    
    <div class="items-grid">
        <div class="item-slot" id="slot-1"><div class="item-title">Слот 1</div></div>
        <div class="item-slot" id="slot-2"><div class="item-title">Слот 2</div></div>
        <div class="item-slot" id="slot-3"><div class="item-title">Слот 3</div></div>
        <div class="item-slot" id="slot-4"><div class="item-title">Слот 4</div></div>
        <div class="item-slot" id="slot-5"><div class="item-title">Слот 5</div></div>
        <div class="item-slot" id="slot-6"><div class="item-title">Слот 6</div></div>
    </div>
    
    <button id="roll-btn" onclick="generateChallenge()" disabled>Крутить рулетку!</button>
</div>

<script>
    let allHeroes = [];
    let allItems = [];

    // Автоматическая загрузка данных при открытии сайта
    async function loadDotaData() {
        try {
            // 1. Получаем список всех героев
            const heroesResponse = await fetch('https://opendota.com');
            const heroesData = await heroesResponse.json();
            
            allHeroes = heroesData.map(h => ({
                name: h.localized_name,
                // Преобразуем системное имя в ссылку на стабильную картинку dota2.net
                img: `https://dota2.net{h.name.replace('npc_dota_hero_', '')}_lg.png`
            }));

            // 2. Получаем список всех предметов
            const itemsResponse = await fetch('https://opendota.com');
            const itemsData = await itemsResponse.json();
            
            // Фильтруем предметы (убираем рецепты, нейтралки и скрытые предметы)
            allItems = Object.values(itemsData).filter(item => 
                item.dname && 
                item.gold > 0 && 
                item.qual !== 'consumable' && 
                !item.dname.includes('Recipe')
            ).map(item => ({
                name: item.dname,
                img: `https://dota2.net{item.img.split('/').pop().replace('_png.png', '_lg.png')}`
            }));

            // Активируем кнопку, когда всё загрузилось
            document.getElementById('status').innerText = `База данных готова! Загружено: ${allHeroes.length} героев и ${allItems.length} предметов.`;
            document.getElementById('roll-btn').disabled = false;

        } catch (error) {
            console.error("Ошибка загрузки данных:", error);
            document.getElementById('status').innerText = "Ошибка загрузки данных. Пожалуйста, обновите страницу.";
        }
    }

    function generateChallenge() {
        if (allHeroes.length === 0 || allItems.length === 0) return;

        // Выбираем случайного героя
        const randomHero = allHeroes[Math.floor(Math.random() * allHeroes.length)];
        const heroImgEl = document.getElementById('hero-image');
        heroImgEl.src = randomHero.img;
        heroImgEl.style.display = 'block';
        document.getElementById('hero-display').innerText = randomHero.name;

        // Перемешиваем предметы для исключения дубликатов
        let shuffledItems = [...allItems].sort(() => 0.5 - Math.random());

        // Заполняем 6 слотов артефактами
        for (let i = 1; i <= 6; i++) {
            const slot = document.getElementById(`slot-${i}`);
            const itemData = shuffledItems[i - 1]; 
            
            slot.innerHTML = `
                <img class="item-img" src="${itemData.img}" style="display:block;" onerror="this.src='https://dota2.net'">
                <div class="item-title">${itemData.name}</div>
            `;
        }
    }

    // Запуск процесса загрузки при старте
    loadDotaData();
</script>

</body>
</html>
