<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Ultimate Roulette</title>
    <style>
        body {
            background-color: #1a1b20;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #22252c;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4c4c; text-transform: uppercase; margin-bottom: 20px; }
        .hero-section { margin: 20px 0; min-height: 160px; }
        .hero-img { width: 200px; height: 114px; border-radius: 6px; display: none; margin: 0 auto 10px; border: 2px solid #444; object-fit: cover; }
        .hero-name { font-size: 24px; font-weight: bold; }
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .item-slot { background: #15161a; padding: 10px; border: 2px solid #3a3d45; border-radius: 6px; min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
        .item-img { width: 85px; height: 60px; border-radius: 4px; display: none; margin: 0 auto 5px; object-fit: cover; }
        .item-title { font-size: 13px; color: #b0b0c2; }
        button {
            background: #ff4c4c; color: white; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        button:hover { background: #ff3333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dota 2 Roulette</h1>
    
    <div class="hero-section">
        <img id="hero-image" class="hero-img" src="" alt="Hero">
        <div class="hero-name" id="hero-display">Нажми на кнопку!</div>
    </div>
    
    <div class="items-grid">
        <div class="item-slot" id="slot-1"><div class="item-title">Слот 1</div></div>
        <div class="item-slot" id="slot-2"><div class="item-title">Слот 2</div></div>
        <div class="item-slot" id="slot-3"><div class="item-title">Слот 3</div></div>
        <div class="item-slot" id="slot-4"><div class="item-title">Слот 4</div></div>
        <div class="item-slot" id="slot-5"><div class="item-title">Слот 5</div></div>
        <div class="item-slot" id="slot-6"><div class="item-title">Слот 6</div></div>
    </div>
    
    <button onclick="generateChallenge()">Крутить рулетку!</button>
</div>

<script>
    // Полноценная встроенная база данных (не зависит от внешних серверов)
    const heroes = [
        { name: "Abaddon", img: "https://imgur.com" },
        { name: "Anti-Mage", img: "https://imgur.com" },
        { name: "Axe", img: "https://imgur.com" },
        { name: "Bloodseeker", img: "https://imgur.com" },
        { name: "Crystal Maiden", img: "https://imgur.com" },
        { name: "Drow Ranger", img: "https://imgur.com" },
        { name: "Earthshaker", img: "https://imgur.com" },
        { name: "Juggernaut", img: "https://imgur.com" },
        { name: "Mirana", img: "https://imgur.com" },
        { name: "Morphling", img: "https://imgur.com" },
        { name: "Phantom Assassin", img: "https://imgur.com" },
        { name: "Pudge", img: "https://imgur.com" },
        { name: "Shadow Fiend", img: "https://imgur.com" },
        { name: "Sniper", img: "https://imgur.com" },
        { name: "Sven", img: "https://imgur.com" },
        { name: "Tiny", img: "https://imgur.com" },
        { name: "Windranger", img: "https://imgur.com" },
        { name: "Zeus", img: "https://imgur.com" },
        { name: "Kunkka", img: "https://imgur.com" },
        { name: "Lina", img: "https://imgur.com" }
    ];

    const items = [
        { name: "Black King Bar", img: "https://imgur.com" },
        { name: "Blink Dagger", img: "https://imgur.com" },
        { name: "Daedalus", img: "https://imgur.com" },
        { name: "Desolator", img: "https://imgur.com" },
        { name: "Divine Rapier", img: "https://imgur.com" },
        { name: "Heart of Tarrasque", img: "https://imgur.com" },
        { name: "Manta Style", img: "https://imgur.com" },
        { name: "Satanic", img: "https://imgur.com" },
        { name: "Scythe of Vyse", img: "https://imgur.com" },
        { name: "Aghanim's Scepter", img: "https://imgur.com" },
        { name: "Assault Cuirass", img: "https://imgur.com" },
        { name: "Bloodthorn", img: "https://imgur.com" },
        { name: "Butterfly", img: "https://imgur.com" },
        { name: "Mjollnir", img: "https://imgur.com" },
        { name: "Monkey King Bar", img: "https://imgur.com" },
        { name: "Octarine Core", img: "https://imgur.com" },
        { name: "Radiance", img: "https://imgur.com" },
        { name: "Refresher Orb", img: "https://imgur.com" },
        { name: "Shiva's Guard" , img: "https://imgur.com" },
        { name: "Silver Edge", img: "https://imgur.com" }
    ];

    function generateChallenge() {
        // Выбираем случайного героя
        const randomHero = heroes[Math.floor(Math.random() * heroes.length)];
        const heroImgEl = document.getElementById('hero-image');
        heroImgEl.src = randomHero.img;
        heroImgEl.style.display = 'block';
        document.getElementById('hero-display').innerText = randomHero.name;

        // Перемешиваем предметы для исключения дубликатов
        let shuffledItems = [...items].sort(() => 0.5 - Math.random());

        // Заполняем 6 слотов артефактами
        for (let i = 1; i <= 6; i++) {
            const slot = document.getElementById(`slot-${i}`);
            const itemData = shuffledItems[i - 1]; 
            
            slot.innerHTML = `
                <img class="item-img" src="${itemData.img}" style="display:block;">
                <div class="item-title">${itemData.name}</div>
            `;
        }
    }
</script>

</body>
</html>
