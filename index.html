        .hero-box { width: 220px; height: 115px; margin: 0 auto 10px; display: none; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; border-radius: 6px; text-shadow: 0 2px 4px #000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center; padding: 5px; box-sizing: border-box; }

        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .item-slot { background: #15161a; padding: 10px; border: 2px solid #3a3d45; border-radius: 6px; min-height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; }

        button { background: linear-gradient(180deg, #ff5252 0%, #c62828 100%); color: white; border: none; padding: 16px 50px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(198,40,40,0.3); transition: transform 0.1s; }

window.onerror = function(message, source, lineno) {
    document.getElementById('debug-error').innerText = "Ошибка: " + message + " (Строка: " + lineno + ")";
    return false;
};

function generateChallenge() {
    try {
        document.getElementById('debug-error').innerText = "";
        
        // Выбор случайного героя
        const randomHero = heroes[Math.floor(Math.random() * heroes.length)];
        const heroBlock = document.getElementById('hero-block');
        heroBlock.style.backgroundColor = randomHero.color;
        heroBlock.style.display = 'flex';
        heroBlock.innerText = randomHero.name.toUpperCase();
        document.getElementById('hero-display').innerText = randomHero.name;
        
        // Перемешивание предметов
        let shuffledItems = [...items].sort(() => 0.5 - Math.random());
        
        // Заполнение 6 уникальных слотов
        for (let i = 1; i <= 6; i++) {
            const slot = document.getElementById(`slot-${i}`);
            const itemData = shuffledItems[i - 1];
            slot.innerHTML = `
                <div class="item-box" style="display:flex; background-color:${itemData.color};">ITEM</div> 
                <div class="item-title">${itemData.name}</div>
            `;
        }
    } catch (err) {
        document.getElementById('debug-error').innerText = "Ошибка логики: " + err.message;
    }
}
