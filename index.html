<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Complete Autonomous Roulette</title>
    <style>
        body {
            background-color: #121316;
            color: #e4e6eb;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: #1c1e22;
            padding: 30px;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid #2d3139;
        }
        h1 { color: #ff4c4c; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; font-size: 26px; }
        .hero-section { margin: 20px 0; min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hero-card-container { width: 220px; height: 125px; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; border: 2px solid #3d424b; }
        .hero-name { font-size: 26px; font-weight: bold; margin-top: 15px; letter-spacing: 1px; min-height: 35px; }
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; }
        .item-slot { background: #151619; padding: 10px; border: 2px solid #2b2e35; border-radius: 8px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
        .item-img-container { width: 90px; height: 64px; display: none; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.4); margin-bottom: 8px; }
        .item-title { font-size: 13px; color: #b0b0c2; font-weight: 500; text-align: center; line-height: 1.2; padding: 0 2px; }
        button {
            background: linear-gradient(180deg, #ff5252 0%, #c62828 100%); color: white; border: none; padding: 16px 50px;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(198, 40, 40, 0.4); transition: background 0.2s, transform 0.1s;
        }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h1>Dota 2 Roulette</h1>
    
    <div class="hero-section">
        <div id="hero-card" class="hero-card-container"></div>
        <div class="hero-name" id="hero-display">Готов к игре?</div>
    </div>
    
    <div class="items-grid">
        <div class="item-slot" id="slot-1"><div class="item-title">Слот 1</div></div>
        <div class="item-slot" id="slot-2"><div class="item-title">Слот 2</div></div>

    <button onclick="generateChallenge()">Крутить рулетку!</button>
