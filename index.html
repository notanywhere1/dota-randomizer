<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Random Roulette</title>
    <style>
        body {
            background-color: #1a1b20;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #22252c;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4c4c; text-transform: uppercase; }
        .hero-section { margin: 20px 0; min-height: 160px; }
        .hero-img { width: 200px; height: 114px; border-radius: 6px; display: none; margin: 0 auto 10px; border: 2px solid #444; object-fit: cover; }
        .hero-name { font-size: 24px; font-weight: bold; }
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .item-slot { background: #15161a; padding: 10px; border: 2px solid #3a3d45; border-radius: 6px; min-height: 90px; }
        .item-img { width: 85px; height: 60px; border-radius: 4px; display: none; margin: 0 auto 5px; object-fit: cover; }
        .item-title { font-size: 13px; color: #b0b0c2; }
        button {
            background: #ff4c4c; color: white; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        button:hover { background: #ff3333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dota 2 Roulette</h1>
    <div class="hero-section">
        <img id="hero-image" class="hero-img" src="" alt="Hero">
        <div class="hero-name" id="hero-display">Нажми на кнопку!</div>
    </div>
    <div class="items-grid">
        <div class="item-slot" id="slot-1"><div class="item-title">Слот 1</div></div>
        <div class="item-slot" id="slot-2"><div class="item-title">Слот 2</div></div>
        <div class="item-slot" id="slot-3"><div class="item-title">Слот 3</div></div>
        <div class="item-slot" id="slot-4"><div class="item-title">Слот 4</div></div>
        <div class="item-slot" id="slot-5"><div class="item-title">Слот 5</div></div>
        <div class="item-slot" id="slot-6"><div class="item-title">Слот 6</div></div>
    </div>
    <button onclick="generateChallenge()">Крутить рулетку!</button>
</div>

<script>
    // Обновленная база данных со стабильными ссылками на изображения
    const heroes = [
        { name: "Pudge", img: "https://dota2.net" },
        { name: "Invoker", img: "https://dota2.net" },
        { name: "Anti-Mage", img: "https://dota2.net" },
        { name: "Shadow Fiend", img: "https://dota2.net" },
        { name: "Phantom Assassin", img: "https://dota2.net" },
        { name: "Crystal Maiden", img: "https://dota2.net" },
        { name: "Juggernaut", img: "https://dota2.net" },
        { name: "Axe", img: "https://dota2.net" }
    ];

    const items = [
        { name: "Blink Dagger", img: "https://dota2.net" },
        { name: "Black King Bar", img: "https://dota2.net" },
        { name: "Aghanim's Scepter", img: "https://dota2.net" },
        { name: "Daedalus", img: "https://dota2.net" },
        { name: "Desolator", img: "https://dota2.net" },
        { name: "Manta Style", img: "https://dota2.net" },
        { name: "Divine Rapier", img: "https://dota2.net" },
        { name: "Heart of Tarrasque", img: "https://dota2.net" }
    ];

    function generateChallenge() {
        try {
            // Выбор героя
            const randomHero = heroes[Math.floor(Math.random() * heroes.length)];
            const heroImgEl = document.getElementById('hero-image');
            heroImgEl.src = randomHero.img;
            heroImgEl.style.display = 'block';
            document.getElementById('hero-display').innerText = randomHero.name;

            // Перемешивание предметов
            let shuffledItems = [...items].sort(() => 0.5 - Math.random());

            // Вывод предметов в 6 слотов
            for (let i = 1; i <= 6; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const itemData = shuffledItems[i - 1]; 
                slot.innerHTML = `
                    <img class="item-img" src="${itemData.img}" style="display:block;">
                    <div class="item-title">${itemData.name}</div>
                `;
            }
        } catch (error) {
            console.error("Ошибка работы рулетки: ", error);
        }
    }
</script>

</body>
</html>
